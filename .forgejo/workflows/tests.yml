# Tests on every push and every pull request (#26). `gate` is the one required check: it fails when any area failed.
#
# Runner choice (#54): a burst of parallel jobs overloads the NAS disks, so the heavy work runs on the workstation
# runner (Docker Desktop) and falls back to the NAS runner (`truenas`) only when no workstation runner is online.
# - `pick-runner` (tiny, on `truenas`) asks the Forgejo API which runners are online (tools/ci_pick_runner.py,
#   secret RUNNER_STATUS_TOKEN = token with scope read:user; without it the fallback is used) and outputs
#   `runner` (a label) and `mode`.
# - mode `parallel` (workstation): one job per area, `runs-on: ${{ needs.pick-runner.outputs.runner }}`.
# - mode `sequential` (fallback): the job `sequential` runs every area in turn in one container on the NAS
#   (one package install instead of five).
# - Every area runs `tools/ci.sh <area>`, so both modes run exactly the same commands.
# - Test the fallback without stopping the workstation: Actions › tests › Run workflow › force_runner = truenas.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_runner:
        description: "auto = workstation when online, else truenas (sequential); werkstation / truenas force one"
        type: choice
        options: [auto, werkstation, truenas]
        default: auto

env:
  # node:20-bookworm has Python 3.11 + git (actions/checkout needs node). Debian packages: no pip at run time.
  PACKAGES: python3-yaml python3-pytest python3-coverage python3-hypothesis
  PYTEST_ADDOPTS: "-rN"

jobs:
  pick-runner:
    runs-on: truenas
    container: {image: "node:20-bookworm"}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      # only the one script, through the API with the automatic token (faster than a checkout)
      - id: pick
        name: pick the runner
        env:
          REPO_TOKEN: ${{ forgejo.token }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          FORCE_RUNNER: ${{ inputs.force_runner || 'auto' }}
        run: |
          curl -sSf --max-time 10 -H "Authorization: token $REPO_TOKEN" -o /tmp/ci_pick_runner.py \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/raw/tools/ci_pick_runner.py?ref=$GITHUB_SHA"
          python3 /tmp/ci_pick_runner.py >> "$GITHUB_OUTPUT"

  # ---- mode parallel: one job per area on the picked (workstation) runner ----
  lint:
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'parallel'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:20-bookworm"}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - {name: tools, run: sh tools/ci.sh tools}
      - {name: Python 3.8 grammar + import lint, run: sh tools/ci.sh lint}

  core:
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'parallel'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:20-bookworm"}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - {name: tools, run: sh tools/ci.sh tools}
      - {name: "core tests, branch coverage gate >= 90 %", run: sh tools/ci.sh core}

  unit:
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'parallel'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:20-bookworm"}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - {name: tools, run: sh tools/ci.sh tools}
      - name: all tests with coverage
        env:
          CAMALERT_DENYLIST: ${{ secrets.CAMALERT_DENYLIST }}
        run: sh tools/ci.sh unit
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: |
            junit-unit.xml
            coverage.xml

  build:
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'parallel'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:20-bookworm"}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - {name: tools, run: sh tools/ci.sh tools}
      - {name: golden listings, package tests and packages, run: sh tools/ci.sh build}
      - uses: actions/upload-artifact@v3
        with:
          name: dist
          path: |
            dist/*.ipk
            dist/*.zip

  ha:
    # Home Assistant runtime tests (#33): oldest supported (hacs.json) and latest Home Assistant
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'parallel'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:20-bookworm"}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ha: [min, latest]
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant ${{ matrix.ha }} runtime tests, integration coverage gate >= 90 %
        env:
          HA_VERSION: ${{ matrix.ha }}
        run: sh tools/ci.sh ha

  androidtv:
    # Android TV player (#64): only in mode parallel = on the workstation runner (Android SDK + Gradle are too heavy
    # for the NAS); the NAS fallback skips it with a message (step in `sequential`).
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'parallel'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:20-bookworm"}
    timeout-minutes: 40
    env:
      PACKAGES: openjdk-17-jdk-headless unzip python3
    steps:
      - uses: actions/checkout@v4
      - {name: tools, run: sh tools/ci.sh tools}
      - {name: "Android TV: contract tests, debug APK, lint, APK listing", run: sh tools/ci.sh androidtv}
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: androidtv
          path: |
            players/androidtv/app/build/outputs/apk/debug/*.apk
            players/androidtv/app/build/reports/lint-results-debug.html
            players/androidtv/api/build/reports/tests/test/

  web:
    # web player and browser extension (#92, #127): Node unit tests of the shared core and Playwright (Chromium) against
    # the fake Home Assistant; only in mode parallel (Chromium download); the NAS fallback runs the unit tests only.
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'parallel'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:22-bookworm"}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - {name: "web player + extension: unit and end-to-end tests", run: sh tools/ci.sh web}
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: web
          path: |
            junit-web.xml
            players/web/test-results/

  pymatrix:
    # Python 3.8 .. 3.13 compatibility matrix (#21): only in mode parallel = on the workstation runner (decision
    # 24-11-2026: not on the NAS); the NAS fallback skips it with a message (step in `sequential`).
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'parallel'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:20-bookworm"}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - {name: "Python 3.8 .. 3.13: core, Enigma2, Kodi and contract tests", run: sh tools/ci.sh pymatrix}
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: pymatrix
          path: junit-py*.xml

  privacy:
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'parallel'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:20-bookworm"}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: privacy check (blocks the GitHub mirror if anything personal slipped in)
        env:
          CAMALERT_DENYLIST: ${{ secrets.CAMALERT_DENYLIST }}
        run: sh tools/ci.sh privacy

  # ---- mode sequential: the NAS fallback runs every area in turn in one container ----
  sequential:
    needs: pick-runner
    if: needs.pick-runner.outputs.mode == 'sequential'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    container: {image: "node:20-bookworm"}
    timeout-minutes: 30
    # no actions/cache: the runner's cache server is not reachable from the NAS job containers (each call waits
    # ~20 s for a timeout); see #54
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - {name: tools, run: sh tools/ci.sh tools}
      - name: privacy check (blocks the GitHub mirror if anything personal slipped in)
        if: ${{ !cancelled() }}
        env:
          CAMALERT_DENYLIST: ${{ secrets.CAMALERT_DENYLIST }}
        run: sh tools/ci.sh privacy
      - {name: Python 3.8 grammar + import lint, if: "${{ !cancelled() }}", run: sh tools/ci.sh lint}
      - {name: "core tests, branch coverage gate >= 90 %", if: "${{ !cancelled() }}", run: sh tools/ci.sh core}
      - name: all tests with coverage
        if: ${{ !cancelled() }}
        env:
          CAMALERT_DENYLIST: ${{ secrets.CAMALERT_DENYLIST }}
        run: sh tools/ci.sh unit
      - {name: golden listings, package tests and packages, if: "${{ !cancelled() }}", run: sh tools/ci.sh build}
      # only the latest Home Assistant here: the oldest one runs on the workstation (keeps the NAS run short)
      - {name: Home Assistant latest runtime tests, if: "${{ !cancelled() }}", run: sh tools/ci.sh ha}
      - name: Android TV (workstation only, skipped here)
        if: ${{ !cancelled() }}
        env:
          ANDROIDTV_SKIP: "NAS fallback, the workstation runner is offline or busy elsewhere"
        run: sh tools/ci.sh androidtv
      - name: web player unit tests (end-to-end on the workstation only)
        if: ${{ !cancelled() }}
        env:
          WEB_E2E_SKIP: "NAS fallback, the workstation runner is offline or busy elsewhere"
        run: sh tools/ci.sh web
      - name: Python matrix (workstation only, skipped here)
        if: ${{ !cancelled() }}
        env:
          PYMATRIX_SKIP: "NAS fallback, the workstation runner is offline or busy elsewhere"
        run: sh tools/ci.sh pymatrix
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: |
            junit-unit.xml
            coverage.xml
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dist
          path: |
            dist/*.ipk
            dist/*.zip

  gate:
    if: always()
    needs: [pick-runner, lint, core, unit, build, ha, androidtv, web, pymatrix, privacy, sequential]
    runs-on: truenas
    container: {image: "node:20-bookworm"}
    timeout-minutes: 2
    steps:
      - name: all areas passed (in either mode)
        env:
          MODE: ${{ needs.pick-runner.outputs.mode }}
          RUNNER: ${{ needs.pick-runner.outputs.runner }}
          PICK: ${{ needs.pick-runner.result }}
          PARALLEL: "${{ needs.lint.result }} ${{ needs.core.result }} ${{ needs.unit.result }} ${{ needs.build.result }} ${{ needs.ha.result }} ${{ needs.androidtv.result }} ${{ needs.web.result }} ${{ needs.pymatrix.result }} ${{ needs.privacy.result }}"
          SEQUENTIAL: ${{ needs.sequential.result }}
        run: |
          echo "pick-runner: $PICK -> runner=$RUNNER mode=$MODE"
          echo "lint core unit build ha androidtv web pymatrix privacy: $PARALLEL; sequential: $SEQUENTIAL"
          test "$PICK" = success || exit 1
          case "$MODE" in
            parallel)   for r in $PARALLEL; do test "$r" = success || exit 1; done ;;
            sequential) test "$SEQUENTIAL" = success || exit 1 ;;
            *)          echo "unknown mode"; exit 1 ;;
          esac

  # ---- #104: the GitHub push mirror has no sync on commit; it only runs after a green gate (privacy included) ----
  mirror:
    needs: gate
    # Paused (28-11-2026): GitHub gets a filtered copy without the contributor notes; until that job exists, nothing
    # is mirrored.
    if: false && needs.gate.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: truenas
    container: {image: "node:20-bookworm"}
    timeout-minutes: 2
    steps:
      - name: start the GitHub push mirror
        env:
          MIRROR_SYNC_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
        run: |
          if [ -z "$MIRROR_SYNC_TOKEN" ]; then
            echo "MIRROR_SYNC_TOKEN not set: start the mirror by hand (POST .../push_mirrors-sync, #104)"
            exit 0
          fi
          curl -sSf --max-time 30 -X POST -H "Authorization: token $MIRROR_SYNC_TOKEN" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/push_mirrors-sync"
          echo "mirror started"
