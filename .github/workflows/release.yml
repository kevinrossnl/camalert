name: build and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: tests
        run: |
          pip install pyyaml
          python3 -m unittest discover -s tests -v
      - name: build ipk
        env:
          CAMALERT_OWNER: ${{ github.repository_owner }}
        run: python3 tools/build_ipk.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
      - name: opkg feed (Packages / Packages.gz)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p feed
          cp dist/*.ipk feed/
          python3 tools/build_feed.py feed
          printf 'src/gz camalert https://%s.github.io/camalert\n' "${{ github.repository_owner }}" > feed/camalert-feed.conf
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: feed
  feed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
