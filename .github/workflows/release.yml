name: build and release
# GitHub only (the Forgejo CI is .forgejo/workflows/tests.yml). Every push and pull request: hassfest, the HACS
# check, the tests and the packages. A tag vX.Y.Z (= __version__) also creates the GitHub release with the packages
# and publishes GitHub Pages (Settings › Pages › Source: GitHub Actions): the opkg feed, the Kodi repository and a
# start page (index.html from .github/pages/index.html).
# While the repository is private the HACS check and Pages are skipped (not failed).
# The Pages site only holds the packages of the LATEST release; older versions stay available as release assets.
# The Android TV app is not released yet: no APK until release signing exists (#65).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    # the HACS action can only validate public repositories: skipped (not failed) while the repository is private
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, like the Forgejo checkout
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: tests (network-free, same areas as the Forgejo CI)
        run: |
          python3 -m pip install -q pytest coverage pyyaml pillow
          sh tools/ci.sh lint
          sh tools/ci.sh core
          sh tools/ci.sh unit
      - name: tag = version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('players/enigma2/CamAlert/__init__.py').read()).group(1))")
          test "${GITHUB_REF_NAME}" = "v$ver" || { echo "tag ${GITHUB_REF_NAME} != v$ver (__version__)"; exit 1; }
          grep -q "^## \[$ver\] - [0-9]\{4\}-[0-9][0-9]-[0-9][0-9]" CHANGELOG.md || { echo "CHANGELOG.md has no dated section [$ver]"; exit 1; }
      - name: build Enigma2 ipk
        env:
          CAMALERT_OWNER: ${{ github.repository_owner }}
        run: python3 tools/build_ipk.py dist
      - name: build Kodi add-on and repository add-on
        run: python3 tools/build_kodi.py dist --repo-url "https://${{ github.repository_owner }}.github.io/camalert/kodi"
      - name: build Home Assistant zip (manual install; HACS installs from the repository)
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          src = "custom_components/camalert"
          ver = json.load(open(os.path.join(src, "manifest.json")))["version"]
          out = "dist/camalert-homeassistant-%s.zip" % ver
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for d, dirs, files in os.walk(src):
                  dirs[:] = sorted(x for x in dirs if x != "__pycache__")
                  for f in sorted(files):
                      p = os.path.join(d, f)
                      info = zipfile.ZipInfo(os.path.relpath(p, "."), (2026, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      z.writestr(info, open(p, "rb").read())
          print(out)
          PY
      - name: release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0, h) == 1 {on=1; next} on && /^## / {exit} on && !/^\[[^]]*\]: / {print}' \
            CHANGELOG.md \
            | sed -E "s#\]\(([A-Za-z][^):]*\.md[^)]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)#g" \
            > dist/release-notes.md   # relative links point to the files of the tag
          test -s dist/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.ipk
            dist/*.zip
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*.ipk
            dist/service.camalert-*.zip
            dist/repository.camalert-*.zip
            dist/camalert-homeassistant-*.zip
      - name: opkg feed (Packages / Packages.gz), Kodi repository and start page for GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p feed/kodi
          cp dist/*.ipk feed/
          cp -r dist/kodi-repo/. feed/kodi/
          # start page index.html from .github/pages/index.html (#80): install per player, no external resources
          python3 tools/build_feed.py feed --index .github/pages/index.html --owner "${{ github.repository_owner }}"
          printf 'src/gz camalert https://%s.github.io/camalert\n' "${{ github.repository_owner }}" > feed/camalert-feed.conf
      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        with:
          path: feed
  pages:
    # GitHub Pages only for a public repository (GitHub Free has no Pages for private ones); the release itself
    # is created either way
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    needs: [build, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
