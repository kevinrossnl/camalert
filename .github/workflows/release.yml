name: build and release
# GitHub only (the Forgejo CI is .forgejo/workflows/tests.yml). Every push and pull request: hassfest, the HACS
# check, the tests and the packages. A tag vX.Y.Z (= __version__) also creates the GitHub release with the packages
# and publishes GitHub Pages (Settings › Pages › Source: GitHub Actions): the opkg feed, the Kodi repository and a
# start page (index.html from .github/pages/index.html).
# While the repository is private the HACS check and Pages are skipped (not failed).
# The Pages site only holds the packages of the LATEST release; older versions stay available as release assets.
# A tag also adds the release-signed Android TV APK (job android, #65) when the signing secrets exist.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    # the HACS action can only validate public repositories: skipped (not failed) while the repository is private
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, like the Forgejo checkout
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: tests (network-free, same areas as the Forgejo CI)
        run: |
          python3 -m pip install -q pytest coverage pyyaml pillow
          sh tools/ci.sh lint
          sh tools/ci.sh core
          sh tools/ci.sh unit
      - name: tag = version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('players/enigma2/CamAlert/__init__.py').read()).group(1))")
          test "${GITHUB_REF_NAME}" = "v$ver" || { echo "tag ${GITHUB_REF_NAME} != v$ver (__version__)"; exit 1; }
          grep -q "^## \[$ver\] - [0-9]\{4\}-[0-9][0-9]-[0-9][0-9]" CHANGELOG.md || { echo "CHANGELOG.md has no dated section [$ver]"; exit 1; }
      - name: build Enigma2 ipk
        env:
          CAMALERT_OWNER: ${{ github.repository_owner }}
        run: python3 tools/build_ipk.py dist
      - name: build Kodi add-on and repository add-on
        run: python3 tools/build_kodi.py dist --repo-url "https://${{ github.repository_owner }}.github.io/camalert/kodi"
      - name: build the browser extension (#127, Load unpacked or the Chrome Web Store later)
        run: python3 tools/build_web.py dist dist
      - name: build Home Assistant zip (manual install; HACS installs from the repository)
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          src = "custom_components/camalert"
          ver = json.load(open(os.path.join(src, "manifest.json")))["version"]
          out = "dist/camalert-homeassistant-%s.zip" % ver
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for d, dirs, files in os.walk(src):
                  dirs[:] = sorted(x for x in dirs if x != "__pycache__")
                  for f in sorted(files):
                      p = os.path.join(d, f)
                      info = zipfile.ZipInfo(os.path.relpath(p, "."), (2026, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      z.writestr(info, open(p, "rb").read())
          print(out)
          PY
      - name: release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0, h) == 1 {on=1; next} on && /^## / {exit} on && !/^\[[^]]*\]: / {print}' \
            CHANGELOG.md \
            | sed -E "s#\]\(([A-Za-z][^):]*\.md[^)]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)#g" \
            > dist/release-notes.md   # relative links point to the files of the tag
          test -s dist/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.ipk
            dist/*.zip
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release-notes.md
          files: |
            dist/*.ipk
            dist/service.camalert-*.zip
            dist/repository.camalert-*.zip
            dist/camalert-homeassistant-*.zip
            dist/camalert-browser-*.zip
      - name: opkg feed (Packages / Packages.gz), Kodi repository and start page for GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p feed/kodi
          cp dist/*.ipk feed/
          cp -r dist/kodi-repo/. feed/kodi/
          # start page index.html from .github/pages/index.html (#80): install per player, no external resources
          python3 tools/build_feed.py feed --index .github/pages/index.html --owner "${{ github.repository_owner }}"
          printf 'src/gz camalert https://%s.github.io/camalert\n' "${{ github.repository_owner }}" > feed/camalert-feed.conf
      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        with:
          path: feed
  android:
    # Android TV / Fire TV app (#65): a release-signed APK on the GitHub release. The key only comes from the secrets
    # ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD; without them this job says so and
    # adds nothing (the release of the other players goes on).
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: release-signed APK
        id: apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CAMALERT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAMALERT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAMALERT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "no ANDROID_KEYSTORE_B64 secret: no APK in this release (#65)"; exit 0; fi
          ver="${GITHUB_REF_NAME#v}"
          code=$(python3 tools/android_version.py "$ver")
          export CAMALERT_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$CAMALERT_KEYSTORE"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
          # bash -e: catch the result so the decoded keystore is removed before a failed build stops the job
          if (cd players/androidtv && ./gradlew --no-daemon --console=plain :app:assembleRelease \
            -PcamalertVersion="$ver" -PcamalertVersionCode="$code"); then rc=0; else rc=$?; fi
          rm -f "$CAMALERT_KEYSTORE"
          test $rc -eq 0
          mkdir -p dist
          cp players/androidtv/app/build/outputs/apk/release/app-release.apk "dist/camalert-androidtv-$ver.apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs \
            "dist/camalert-androidtv-$ver.apk"
          echo "file=dist/camalert-androidtv-$ver.apk" >> "$GITHUB_OUTPUT"
      - name: add the APK to the release
        if: steps.apk.outputs.file != ''
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.file }}
      # #126: players updated from Home Assistant only install a file whose SHA-256 is listed here. Written after
      # the APK (this job needs build), over every release file, so it is published once and complete.
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          ls *.ipk service.camalert-*.zip repository.camalert-*.zip camalert-homeassistant-*.zip camalert-browser-*.zip \
            camalert-androidtv-*.apk \
            2>/dev/null | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          grep -q '_all\.ipk$' SHA256SUMS && grep -q 'service\.camalert-.*\.zip$' SHA256SUMS
      - name: add SHA256SUMS to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/SHA256SUMS

  pages:
    # GitHub Pages only for a public repository (GitHub Free has no Pages for private ones); the release itself
    # is created either way
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    needs: [build, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
