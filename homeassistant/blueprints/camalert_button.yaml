blueprint:
  name: CamAlert - remote button does something
  description: >-
    While a camera is on the TV, a colour key on the remote runs an action, e.g. open the gate or unlock the
    door when the doorbell camera shows who is there. The receiver must be added with the CamAlert integration
    (or via MQTT: then use the "Remote button" event entity of the MQTT device in your own automation).
  domain: automation
  source_url: https://github.com/kevinrossnl/camalert/blob/main/homeassistant/blueprints/camalert_button.yaml
  input:
    receivers:
      name: Receivers
      selector:
        device:
          integration: camalert
          multiple: true
    button:
      name: Colour key
      default: green
      selector:
        select:
          options:
            - {label: Red, value: red}
            - {label: Green, value: green}
            - {label: Yellow, value: yellow}
            - {label: Blue, value: blue}
    camera:
      name: Only for this camera (optional)
      description: Camera name as in go2rtc. Empty = any camera.
      default: ""
      selector:
        text:
    action:
      name: Action
      selector:
        action:
mode: single
max_exceeded: silent
variables:
  receivers: !input receivers
  wanted_camera: !input camera
triggers:
  - trigger: event
    event_type: camalert_button
    event_data:
      button: !input button
conditions:
  - condition: template
    value_template: >-
      {{ trigger.event.data.device_id in receivers
         and (wanted_camera | trim == '' or trigger.event.data.camera == wanted_camera | trim) }}
actions: !input action
