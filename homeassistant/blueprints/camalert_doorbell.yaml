blueprint:
  name: CamAlert - doorbell or person at the door
  description: >-
    Always shows a camera on the TV (priority "high": also with do not disturb, outside the time window and while
    playing) when the doorbell rings or a person is detected. Needs the CamAlert integration. Inputs: see
    homeassistant/blueprints/README.md.
  domain: automation
  source_url: https://github.com/kevinrossnl/camalert/blob/main/homeassistant/blueprints/camalert_doorbell.yaml
  input:
    doorbell:
      name: Doorbell / person sensor
      description: Doorbell (event or binary sensor) or person detection. You can pick several.
      selector:
        entity:
          multiple: true
          filter:
            - domain: [binary_sensor, event]
    players:
      name: Players (receivers / Kodi)
      description: CamAlert players that show the camera (Enigma2 receivers in standby ignore it).
      selector:
        device:
          integration: camalert
          multiple: true
    camera:
      name: Camera
      description: Camera name as in go2rtc, e.g. front_door.
      selector:
        text:
    mode:
      name: Display mode
      default: photo
      selector:
        select:
          options:
            - {label: Photo window, value: photo}
            - {label: Live view, value: live}
            - {label: Notification, value: notify}
    seconds:
      name: Duration
      default: 30
      selector:
        number: {min: 5, max: 300, step: 5, unit_of_measurement: s}
    label:
      name: Who/what (optional)
      description: Text before the camera name in the title, e.g. Doorbell. Empty = none.
      default: ""
      selector:
        text:
    presence:
      name: Only when someone is home (optional)
      description: >-
        Show on the TV only when at least one of these is home: a person or device tracker (state home), a group of
        them, or a zone with someone in it (e.g. zone.home). Empty = always.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: [person, device_tracker, group, zone]
mode: single
max_exceeded: silent
variables:
  label_in: !input label
  presence_in: !input presence
  someone_home: >-
    {% set ents = presence_in if presence_in is list else ([presence_in] if presence_in else []) %}
    {{ ents | count == 0
       or ents | select('is_state', 'home') | list | count > 0
       or ents | select('match', 'zone\\.') | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}
triggers:
  - trigger: state
    entity_id: !input doorbell
conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none and trigger.to_state.state not in ['unavailable', 'unknown', 'off']
         and (trigger.to_state.domain == 'event' or trigger.to_state.state == 'on') }}
actions:
  - if:
      - condition: template
        value_template: "{{ someone_home }}"
    then:
      - action: camalert.show
        target:
          device_id: !input players
        data:
          camera: !input camera
          seconds: !input seconds
          mode: !input mode
          priority: high
          label: "{{ label_in | trim }}"
        continue_on_error: true
