blueprint:
  name: CamAlert - doorbell or person at the door
  description: >-
    Always shows a camera on the TV (priority "high": also with do not disturb, outside the time window and while
    playing) when the doorbell rings or a person is detected. Needs the CamAlert integration. Inputs: see
    homeassistant/blueprints/README.md.
  domain: automation
  source_url: https://github.com/kevinrossnl/camalert/blob/main/homeassistant/blueprints/camalert_doorbell.yaml
  input:
    doorbell:
      name: Doorbell / person sensor
      description: Doorbell (event or binary sensor) or person detection. You can pick several.
      selector:
        entity:
          multiple: true
          filter:
            - domain: [binary_sensor, event]
    players:
      name: Players (receivers / Kodi / Android TV)
      description: CamAlert players that show the camera (Enigma2 receivers in standby ignore it).
      selector:
        device:
          integration: camalert
          multiple: true
    camera:
      name: Camera
      description: Camera name as in go2rtc, e.g. front_door.
      selector:
        text:
    mode:
      name: Display mode
      default: photo
      selector:
        select:
          options:
            - {label: Photo window, value: photo}
            - {label: Live view, value: live}
            - {label: Notification, value: notify}
    seconds:
      name: Duration
      default: 30
      selector:
        number: {min: 5, max: 300, step: 5, unit_of_measurement: s}
    label:
      name: Who/what (optional)
      description: Text before the camera name in the title, e.g. Doorbell. Empty = none.
      default: ""
      selector:
        text:
    presence:
      name: Only when someone is home (optional)
      description: >-
        Show on the TV only when at least one of these is home: a person or device tracker (state home), a group of
        them, or a zone with someone in it (e.g. zone.home). Empty = always.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: [person, device_tracker, group, zone]
    phone_notify:
      name: Also notify phones (optional)
      description: >-
        Notify actions of the Home Assistant Companion app, comma-separated, e.g. notify.mobile_app_my_phone
        (`notify.` may be left out): a notification "Doorbell - camera" also when nobody is home. Empty = none.
      default: ""
      selector:
        text:
    phone_camera:
      name: Camera entity for the phone (optional)
      description: >-
        Camera entity (e.g. camera.front_door): the phone notification shows its picture and opens the camera when
        tapped. Empty = text only.
      default: ""
      selector:
        entity:
          filter:
            - domain: camera
    phone_buttons:
      name: Buttons on the phone notification
      description: >-
        "Show on TV" (shows the camera on these players) and "Do not disturb 1 h" (on these players). Needs the
        CamAlert integration 1.4 or newer.
      default: true
      selector:
        boolean:
    phone_critical:
      name: Critical phone notification
      description: >-
        Comes through the phone's silent mode and Do not disturb (iOS critical alert, Android alarm channel).
      default: false
      selector:
        boolean:
mode: single
max_exceeded: silent
variables:
  label_in: !input label
  camera_in: !input camera
  phone_notify_in: !input phone_notify
  phone_camera_in: !input phone_camera
  phone_buttons_in: !input phone_buttons
  phone_critical_in: !input phone_critical
  players_in: !input players
  phone_targets: >-
    {{ phone_notify_in.split(',') | map('trim') | reject('eq', '')
       | map('regex_replace', '^(?!notify\\.)', 'notify.') | list }}
  phone_message: "{{ (label_in | trim or 'Doorbell') ~ ' - ' ~ camera_in }}"
  phone_data: >-
    {% set cam = phone_camera_in %}
    {% set devs = (players_in if players_in is list else [players_in]) | join(',') %}
    {% set d = {'tag': 'camalert_' ~ camera_in, 'group': 'camalert'} %}
    {% if cam %}{% set d = dict(d, image='/api/camera_proxy/' ~ cam, entity_id=cam,
       clickAction='entityId:' ~ cam, url='entityId:' ~ cam) %}{% endif %}
    {% if phone_buttons_in %}{% set d = dict(d, actions=[
       {'action': 'CAMALERT_SHOW|' ~ camera_in ~ '|' ~ devs, 'title': 'Show on TV'},
       {'action': 'CAMALERT_DND|60|' ~ devs, 'title': 'Do not disturb 1 h'}]) %}{% endif %}
    {% if phone_critical_in %}{% set d = dict(d, push={'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}},
       ttl=0, priority='high', channel='alarm_stream') %}{% endif %}
    {{ d }}
  presence_in: !input presence
  someone_home: >-
    {% set ents = presence_in if presence_in is list else ([presence_in] if presence_in else []) %}
    {{ ents | count == 0
       or ents | select('is_state', 'home') | list | count > 0
       or ents | select('match', 'zone\\.') | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}
triggers:
  - trigger: state
    entity_id: !input doorbell
conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none and trigger.to_state.state not in ['unavailable', 'unknown', 'off']
         and (trigger.to_state.domain == 'event' or trigger.to_state.state == 'on') }}
actions:
  - if:
      - condition: template
        value_template: "{{ someone_home }}"
    then:
      - action: camalert.show
        target:
          device_id: !input players
        data:
          camera: !input camera
          seconds: !input seconds
          mode: !input mode
          priority: high
          label: "{{ label_in | trim }}"
        continue_on_error: true
  # #14: also on the phone (Companion app), also when nobody is home; never blocks the TV part
  - if:
      - condition: template
        value_template: "{{ phone_notify_in | trim | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ phone_targets }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
                title: CamAlert
                message: "{{ phone_message }}"
                data: "{{ phone_data }}"
              continue_on_error: true
        continue_on_error: true
