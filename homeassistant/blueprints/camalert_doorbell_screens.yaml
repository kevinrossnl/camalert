blueprint:
  name: CamAlert - doorbell on the players and other screens
  description: >-
    As "doorbell or person at the door" (priority "high" on the CamAlert players), plus screens without CamAlert:
    live view on Chromecast / Google TV (camera.play_stream, full screen) and a notification with a picture on
    Android TV / Fire TV ("Notifications for Android TV / Fire TV" integration). Needs the CamAlert integration.
    Inputs: see homeassistant/blueprints/README.md.
  domain: automation
  source_url: https://github.com/kevinrossnl/camalert/blob/main/homeassistant/blueprints/camalert_doorbell_screens.yaml
  input:
    doorbell:
      name: Doorbell / person sensor
      description: Doorbell (event or binary sensor) or person detection. You can pick several.
      selector:
        entity:
          multiple: true
          filter:
            - domain: [binary_sensor, event]
    players:
      name: Players (receivers / Kodi / Android TV)
      description: CamAlert players that show the camera (Enigma2 receivers in standby ignore it).
      selector:
        device:
          integration: camalert
          multiple: true
    camera:
      name: Camera
      description: Camera name as in go2rtc, e.g. front_door.
      selector:
        text:
    mode:
      name: Display mode
      default: photo
      selector:
        select:
          options:
            - {label: Photo window, value: photo}
            - {label: Live view, value: live}
            - {label: Notification, value: notify}
    seconds:
      name: Duration
      default: 30
      selector:
        number: {min: 5, max: 300, step: 5, unit_of_measurement: s}
    label:
      name: Who/what (optional)
      description: Text before the camera name in the title, e.g. Doorbell. Empty = none.
      default: ""
      selector:
        text:
    cast_players:
      name: Chromecast / Google TV (optional)
      description: >-
        Media players that show the camera full screen (live view through camera.play_stream), for TVs without
        CamAlert. Stopped again after the duration (the Chromecast then shows its home screen). Empty = none.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    cast_camera:
      name: Camera entity for Chromecast (optional)
      description: Camera entity that can stream (e.g. camera.front_door). Needed for Chromecast.
      default: ""
      selector:
        entity:
          filter:
            - domain: camera
    androidtv_notify:
      name: Android TV / Fire TV notification (optional)
      description: >-
        Notify action of the "Notifications for Android TV / Fire TV" integration, e.g. notify.android_tv_living_room
        (`notify.` may be left out). A small window with text (and a picture) for the duration. Empty = none.
      default: ""
      selector:
        text:
    androidtv_snapshot_url:
      name: Picture for Android TV (optional)
      description: >-
        Picture address the TV downloads itself, e.g. http://192.168.1.10:1984/api/frame.jpeg?src=front_door&width=640.
        Empty = text only.
      default: ""
      selector:
        text:
    presence:
      name: Only when someone is home (optional)
      description: >-
        Show on the TV only when at least one of these is home: a person or device tracker (state home), a group of
        them, or a zone with someone in it (e.g. zone.home). Empty = always.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: [person, device_tracker, group, zone]
mode: single
max_exceeded: silent
variables:
  label_in: !input label
  camera_in: !input camera
  seconds_in: !input seconds
  cast_players_in: !input cast_players
  cast_camera_in: !input cast_camera
  androidtv_notify_in: !input androidtv_notify
  androidtv_snapshot_url_in: !input androidtv_snapshot_url
  message: "{{ (label_in | trim or 'Doorbell') ~ ' - ' ~ camera_in }}"
  androidtv_action: >-
    {% set a = androidtv_notify_in | trim %}{{ a if a.startswith('notify.') else 'notify.' ~ a }}
  androidtv_data: >-
    {% set d = {'duration': seconds_in | int(30)} %}
    {{ dict(d, image={'url': androidtv_snapshot_url_in | trim}) if androidtv_snapshot_url_in | trim else d }}
  presence_in: !input presence
  someone_home: >-
    {% set ents = presence_in if presence_in is list else ([presence_in] if presence_in else []) %}
    {{ ents | count == 0
       or ents | select('is_state', 'home') | list | count > 0
       or ents | select('match', 'zone\\.') | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}
triggers:
  - trigger: state
    entity_id: !input doorbell
conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none and trigger.to_state.state not in ['unavailable', 'unknown', 'off']
         and (trigger.to_state.domain == 'event' or trigger.to_state.state == 'on') }}
  - condition: template
    value_template: "{{ someone_home }}"
actions:
  - action: camalert.show
    target:
      device_id: !input players
    data:
      camera: !input camera
      seconds: !input seconds
      mode: !input mode
      priority: high
      label: "{{ label_in | trim }}"
    continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ androidtv_notify_in | trim | length > 0 }}"
    then:
      - action: "{{ androidtv_action }}"
        data:
          title: CamAlert
          message: "{{ message }}"
          data: "{{ androidtv_data }}"
        continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ cast_players_in | count > 0 and cast_camera_in | length > 0 }}"
    then:
      - action: camera.play_stream
        target:
          entity_id: "{{ cast_camera_in }}"
        data:
          media_player: "{{ cast_players_in }}"
          format: hls
        continue_on_error: true
      - delay:
          seconds: "{{ seconds_in | int(30) }}"
      - action: media_player.media_stop
        target:
          entity_id: "{{ cast_players_in }}"
        continue_on_error: true
