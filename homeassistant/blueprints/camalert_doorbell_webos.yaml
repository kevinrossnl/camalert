blueprint:
  name: CamAlert - doorbell on the players and an LG webOS TV
  description: >-
    Like "doorbell or person at the door" (priority "high"), and also shows a notification with a snapshot on an LG
    TV through the LG webOS TV integration (#16), e.g. a TV in another room without a player. Needs the CamAlert
    integration and the LG webOS TV integration. Inputs: see homeassistant/blueprints/README.md.
  domain: automation
  source_url: https://github.com/kevinrossnl/camalert/blob/main/homeassistant/blueprints/camalert_doorbell_webos.yaml
  input:
    doorbell:
      name: Doorbell / person sensor
      description: Doorbell (event or binary sensor) or person detection. You can pick several.
      selector:
        entity:
          multiple: true
          filter:
            - domain: [binary_sensor, event]
    players:
      name: Players (receivers / Kodi)
      description: CamAlert players that show the camera (Enigma2 receivers in standby ignore it).
      selector:
        device:
          integration: camalert
          multiple: true
    camera:
      name: Camera
      description: Camera name as in go2rtc, e.g. front_door.
      selector:
        text:
    mode:
      name: Display mode
      default: photo
      selector:
        select:
          options:
            - {label: Photo window, value: photo}
            - {label: Live view, value: live}
            - {label: Notification, value: notify}
    seconds:
      name: Duration
      default: 30
      selector:
        number: {min: 5, max: 300, step: 5, unit_of_measurement: s}
    label:
      name: Who/what (optional)
      description: Text before the camera name in the title, e.g. Doorbell. Empty = none.
      default: ""
      selector:
        text:
    webos_notify:
      name: LG TV notify action
      description: >-
        The notify action of the TV from the LG webOS TV integration, e.g. notify.lg_webos_tv_living_room
        (Developer tools › Actions, search for "notify.").
      selector:
        text:
    message:
      name: LG TV message (optional)
      description: Text of the notification. Empty = who/what and the camera name, e.g. "Doorbell - front_door".
      default: ""
      selector:
        text:
    snapshot_camera:
      name: Snapshot camera (optional)
      description: >-
        Camera entity for the picture in the notification. Empty = text only. The snapshot is saved in
        snapshot_file and replaced at every ring. The LG TV refuses pictures over 100 KB (102400 bytes, #74) and
        then shows nothing: a main-stream snapshot is usually larger, so prefer "Snapshot URL" below.
      default: ""
      selector:
        entity:
          filter:
            - domain: camera
    snapshot_file:
      name: Snapshot file
      description: >-
        Where the snapshot is saved; the folder must be allowed (allowlist_external_dirs; the media folder is by
        default). Not in www: everything there is public without login.
      default: /media/camalert_webos.jpg
      selector:
        text:
    tv:
      name: LG TV (optional)
      description: The TV's media player. When set, the notification is only sent while the TV is on.
      default: ""
      selector:
        entity:
          filter:
            - integration: webostv
              domain: media_player
    snapshot_url:
      name: Snapshot URL (optional)
      description: >-
        A small picture for the notification (#74), e.g. the go2rtc frame
        http://192.168.1.10:1984/api/frame.jpeg?src=front_door&width=640 (about 25 KB; the LG TV refuses more than
        100 KB). Needs the Downloader integration with the folder of snapshot_file (default /media) as download
        folder. Used instead of the snapshot camera. When the download fails or takes longer than 15 seconds, the
        notification is sent as text only.
      default: ""
      selector:
        text:
    presence:
      name: Only when someone is home (optional)
      description: >-
        Show on the TV only when at least one of these is home: a person or device tracker (state home), a group of
        them, or a zone with someone in it (e.g. zone.home). Empty = always.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: [person, device_tracker, group, zone]
    phone_notify:
      name: Also notify a phone (optional)
      description: >-
        Notify action of the Home Assistant Companion app, e.g. notify.mobile_app_my_phone (`notify.` may be left
        out): a notification "Doorbell - camera" also when nobody is home. Empty = no phone notification.
      default: ""
      selector:
        text:
    phone_camera:
      name: Camera entity for the phone (optional)
      description: >-
        Camera entity (e.g. camera.front_door): the phone notification shows its picture and opens the camera when
        tapped. Empty = text only.
      default: ""
      selector:
        entity:
          filter:
            - domain: camera
mode: single
max_exceeded: silent
variables:
  label_in: !input label
  camera_in: !input camera
  webos_notify_in: !input webos_notify
  message_in: !input message
  snapshot_camera_in: !input snapshot_camera
  snapshot_file_in: !input snapshot_file
  tv_in: !input tv
  snapshot_url_in: !input snapshot_url
  phone_notify_in: !input phone_notify
  phone_camera_in: !input phone_camera
  phone_action: >-
    {% set a = phone_notify_in | trim %}{{ a if a.startswith('notify.') else 'notify.' ~ a }}
  phone_message: "{{ (label_in | trim or 'Doorbell') ~ ' - ' ~ camera_in }}"
  phone_data: >-
    {{ {'image': '/api/camera_proxy/' ~ phone_camera_in, 'entity_id': phone_camera_in,
        'clickAction': 'entityId:' ~ phone_camera_in, 'url': 'entityId:' ~ phone_camera_in}
       if phone_camera_in else {} }}
  presence_in: !input presence
  someone_home: >-
    {% set ents = presence_in if presence_in is list else ([presence_in] if presence_in else []) %}
    {{ ents | count == 0
       or ents | select('is_state', 'home') | list | count > 0
       or ents | select('match', 'zone\\.') | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}
  snapshot_name: "{{ (snapshot_file_in | trim).split('/') | last }}"
  webos_message: >-
    {{ message_in | trim if message_in | trim else ((label_in | trim or 'Doorbell') ~ ' - ' ~ camera_in) }}
  webos_action: >-
    {% set a = webos_notify_in | trim %}{{ a if a.startswith('notify.') else 'notify.' ~ a }}
triggers:
  - trigger: state
    entity_id: !input doorbell
conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none and trigger.to_state.state not in ['unavailable', 'unknown', 'off']
         and (trigger.to_state.domain == 'event' or trigger.to_state.state == 'on') }}
actions:
  - if:
      - condition: template
        value_template: "{{ someone_home }}"
    then:
      - action: camalert.show
        target:
          device_id: !input players
        data:
          camera: !input camera
          seconds: !input seconds
          mode: !input mode
          priority: high
          label: "{{ label_in | trim }}"
        continue_on_error: true
  - if:
      - condition: template
        value_template: >-
          {{ someone_home and (not tv_in or states(tv_in) not in ['off', 'unavailable', 'unknown']) }}
    then:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ snapshot_url_in | trim | length > 0 }}"
            sequence:
              # #74: a small picture through the Downloader integration. The download runs while the first branch
              # waits for its completed/failed event; failed or no event within 15 s = text only.
              - parallel:
                  - sequence:
                      - wait_for_trigger:
                          - trigger: event
                            event_type: downloader_download_completed
                            event_data:
                              url: !input snapshot_url
                          - trigger: event
                            event_type: downloader_download_failed
                            event_data:
                              url: !input snapshot_url
                        timeout: "00:00:15"
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: >-
                              {{ wait.trigger is not none
                                 and wait.trigger.event.event_type == 'downloader_download_completed' }}
                        then:
                          - action: "{{ webos_action }}"
                            data:
                              message: "{{ webos_message }}"
                              data:
                                icon: "{{ snapshot_file_in | trim }}"
                            continue_on_error: true
                        else:
                          - action: "{{ webos_action }}"
                            data:
                              message: "{{ webos_message }}"
                            continue_on_error: true
                  - sequence:
                      - delay:
                          milliseconds: 100
                      - action: downloader.download_file
                        data:
                          url: "{{ snapshot_url_in | trim }}"
                          filename: "{{ snapshot_name }}"
                          overwrite: true
                        continue_on_error: true
          - conditions:
              - condition: template
                value_template: "{{ snapshot_camera_in | length > 0 }}"
            sequence:
              # the LG TV refuses pictures over 100 KB (#74): a large snapshot means no notification at all
              - action: camera.snapshot
                target:
                  entity_id: "{{ snapshot_camera_in }}"
                data:
                  filename: "{{ snapshot_file_in }}"
                continue_on_error: true
              - action: "{{ webos_action }}"
                data:
                  message: "{{ webos_message }}"
                  data:
                    icon: "{{ snapshot_file_in }}"
                continue_on_error: true
        default:
          - action: "{{ webos_action }}"
            data:
              message: "{{ webos_message }}"
            continue_on_error: true
  # #14: also on the phone (Companion app), also when nobody is home; never blocks the TV part
  - if:
      - condition: template
        value_template: "{{ phone_notify_in | trim | length > 0 }}"
    then:
      - action: "{{ phone_action }}"
        data:
          title: CamAlert
          message: "{{ phone_message }}"
          data: "{{ phone_data }}"
        continue_on_error: true
