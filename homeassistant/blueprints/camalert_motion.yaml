blueprint:
  name: CamAlert - motion when armed or at set times
  description: >-
    Shows the camera(s) on the TV when there is motion, but only when your alarm is armed and/or between the
    times you choose. 2-4 cameras are shown together in the multi-camera window (or as a full-screen mosaic, see
    below); the title says what was seen (Person / Motion, or your own text). Needs the CamAlert integration.
    Inputs: see homeassistant/blueprints/README.md.
  domain: automation
  source_url: https://github.com/kevinrossnl/camalert/blob/main/homeassistant/blueprints/camalert_motion.yaml
  input:
    motion:
      name: Motion sensors
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    players:
      name: Players (receivers / Kodi / Android TV)
      selector:
        device:
          integration: camalert
          multiple: true
    cameras:
      name: Cameras
      description: >-
        Camera names as in go2rtc, comma separated (e.g. front_door, garden). Leave empty to use the camera named
        after the sensor that saw motion (binary_sensor.garden_motion -> garden).
      default: ""
      selector:
        text:
    mode:
      name: Display mode (one camera)
      default: photo
      selector:
        select:
          options:
            - {label: Photo window, value: photo}
            - {label: Live view, value: live}
            - {label: Notification, value: notify}
    several:
      name: Several cameras
      default: strip
      selector:
        select:
          options:
            - {label: "Multi-camera window (2-4 cameras, the TV stays visible)", value: strip}
            - {label: Mosaic (full screen), value: mosaic}
    seconds:
      name: Duration
      default: 30
      selector:
        number: {min: 5, max: 300, step: 5, unit_of_measurement: s}
    label:
      name: Who/what (optional)
      description: Text before the camera name in the title. Empty = Person or Motion, from the sensor's name.
      default: ""
      selector:
        text:
    when:
      name: When
      default: armed
      selector:
        select:
          options:
            - {label: Only when the alarm is armed, value: armed}
            - {label: Only between the times below, value: time}
            - {label: Alarm armed OR between the times, value: armed_or_time}
            - {label: Alarm armed AND between the times, value: armed_and_time}
            - {label: Always, value: always}
    alarm_panel:
      name: Alarm panel (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: alarm_control_panel
    from_time:
      name: From
      default: "22:00:00"
      selector:
        time:
    until_time:
      name: Until
      default: "07:00:00"
      selector:
        time:
    presence:
      name: Only when someone is home (optional)
      description: >-
        Show on the TV only when at least one of these is home: a person or device tracker (state home), a group of
        them, or a zone with someone in it (e.g. zone.home). Empty = always.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: [person, device_tracker, group, zone]
    until_motion_ends:
      name: Until the motion ends
      description: >-
        Keep the camera on the TV as long as one of the motion sensors is on (at most 10 minutes), then hide it.
        The duration above is then not used. Hide closes whatever CamAlert shows on these players at that moment.
      default: false
      selector:
        boolean:
    phone_notify:
      name: Also notify phones (optional)
      description: >-
        Notify actions of the Home Assistant Companion app, comma-separated, e.g. notify.mobile_app_my_phone
        (`notify.` may be left out). Empty = no phone notification.
      default: ""
      selector:
        text:
    phone_camera:
      name: Camera entity for the phone (optional)
      description: >-
        Camera entity (e.g. camera.front_door): the phone notification shows its picture and opens the camera when
        tapped. Empty = text only.
      default: ""
      selector:
        entity:
          filter:
            - domain: camera
    phone_buttons:
      name: Buttons on the phone notification
      description: >-
        "Show on TV" (shows the camera on these players) and "Do not disturb 1 h" (on these players). Needs the
        CamAlert integration 1.4 or newer.
      default: true
      selector:
        boolean:
    phone_critical:
      name: Critical phone notification
      description: >-
        Comes through the phone's silent mode and Do not disturb (iOS critical alert, Android alarm channel).
      default: false
      selector:
        boolean:
mode: single
max_exceeded: silent
variables:
  when: !input when
  mode_single: !input mode
  panel: !input alarm_panel
  start: !input from_time
  end: !input until_time
  cams_in: !input cameras
  several: !input several
  label_in: !input label
  presence_in: !input presence
  hold: !input until_motion_ends
  seconds_in: !input seconds
  motion_in: !input motion
  someone_home: >-
    {% set ents = presence_in if presence_in is list else ([presence_in] if presence_in else []) %}
    {{ ents | count == 0
       or ents | select('is_state', 'home') | list | count > 0
       or ents | select('match', 'zone\\.') | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}
  label: >-
    {% set s = trigger.entity_id.split('.')[1] %}{{ label_in | trim if label_in | trim != ''
       else ('Person' if 'person' in s else 'Motion') }}
  armed: >-
    {{ panel != '' and states(panel).startswith('armed') }}
  in_time: >-
    {% set n = now().strftime('%H:%M:%S') %}
    {{ (start <= n < end) if start < end else (n >= start or n < end) }}
  cams: >-
    {%- if cams_in | trim != '' -%}{{ cams_in.split(',') | map('trim') | reject('eq', '') | list }}
    {%- else -%}{{ [trigger.entity_id.split('.')[1] | regex_replace('_(motion|person_detected|person|occupancy)$', '')] }}
    {%- endif -%}
  phone_notify_in: !input phone_notify
  phone_camera_in: !input phone_camera
  phone_buttons_in: !input phone_buttons
  phone_critical_in: !input phone_critical
  players_in: !input players
  phone_targets: >-
    {{ phone_notify_in.split(',') | map('trim') | reject('eq', '')
       | map('regex_replace', '^(?!notify\\.)', 'notify.') | list }}
  phone_message: "{{ label ~ ' - ' ~ cams | join(', ') }}"
  phone_data: >-
    {% set cam = phone_camera_in %}
    {% set devs = (players_in if players_in is list else [players_in]) | join(',') %}
    {% set d = {'tag': 'camalert_motion_' ~ cams[0], 'group': 'camalert'} %}
    {% if cam %}{% set d = dict(d, image='/api/camera_proxy/' ~ cam, entity_id=cam,
       clickAction='entityId:' ~ cam, url='entityId:' ~ cam) %}{% endif %}
    {% if phone_buttons_in %}{% set d = dict(d, actions=[
       {'action': 'CAMALERT_SHOW|' ~ (cams | join(',')) ~ '|' ~ devs, 'title': 'Show on TV'},
       {'action': 'CAMALERT_DND|60|' ~ devs, 'title': 'Do not disturb 1 h'}]) %}{% endif %}
    {% if phone_critical_in %}{% set d = dict(d, push={'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}},
       ttl=0, priority='high', channel='alarm_stream') %}{% endif %}
    {{ d }}
triggers:
  - trigger: state
    entity_id: !input motion
    from: "off"
    to: "on"
conditions:
  - condition: template
    value_template: >-
      {{ when == 'always'
         or (when == 'armed' and armed)
         or (when == 'time' and in_time)
         or (when == 'armed_or_time' and (armed or in_time))
         or (when == 'armed_and_time' and armed and in_time) }}
actions:
  # #128: presence only gates the TV; the phone also gets it when nobody is home
  - if:
      - condition: template
        value_template: "{{ someone_home }}"
    then:
      - if:
          - condition: template
            value_template: "{{ cams | length > 1 and (several == 'mosaic' or cams | length > 4) }}"
        then:
          - action: camalert.mosaic
            target:
              device_id: !input players
            data:
              cameras: "{{ cams }}"
              seconds: "{{ 300 if hold else seconds_in }}"
            continue_on_error: true
        else:
          - action: camalert.show
            target:
              device_id: !input players
            data:
              camera: "{{ cams if cams | length > 1 else cams[0] }}"
              seconds: "{{ 0 if hold else seconds_in }}"
              mode: "{{ 'strip' if cams | length > 1 else mode_single }}"
              priority: high
              label: "{{ label }}"
            continue_on_error: true
  # #128: also on the phones (Companion app), with buttons; never waits for the hold part below
  - if:
      - condition: template
        value_template: "{{ phone_notify_in | trim | length > 0 }}"
    then:
      - repeat:
          for_each: "{{ phone_targets }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
                title: CamAlert
                message: "{{ phone_message }}"
                data: "{{ phone_data }}"
              continue_on_error: true
        continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ hold and someone_home }}"
    then:
      # #81: wait until every motion sensor is off again (the player's limit is 10 minutes), then hide
      - wait_template: >-
          {{ (motion_in if motion_in is list else [motion_in]) | select('is_state', 'on') | list | count == 0 }}
        timeout: "00:10:00"
      - action: camalert.hide
        target:
          device_id: !input players
        continue_on_error: true
