blueprint:
  name: DoorCam - show camera on TV
  description: >-
    Shows a camera on an Enigma2 receiver with the DoorCam plugin when a sensor turns on
    (motion, person, doorbell). Needs the DoorCam package (rest_command.doorcam_show), see
    https://github.com/OWNER/enigma2-plugin-doorcam/blob/main/docs/home-assistant.md
  domain: automation
  source_url: https://github.com/OWNER/enigma2-plugin-doorcam/blob/main/homeassistant/blueprints/doorcam_show_camera.yaml
  input:
    trigger_entity:
      name: Trigger
      description: Motion sensor, person sensor or doorbell (anything that turns "on").
      selector:
        entity:
          domain: binary_sensor
    receiver_host:
      name: Receiver IP address
      description: For example 192.168.1.30
      selector:
        text:
    receiver_player:
      name: Receiver media player (optional)
      description: Only show the camera when this media player is on. Leave empty to always try (DoorCam itself ignores requests in standby).
      default: ""
      selector:
        entity:
          domain: media_player
    camera:
      name: Camera
      description: The go2rtc stream name, for example front_door
      selector:
        text:
    seconds:
      name: Duration
      default: 30
      selector:
        number:
          min: 5
          max: 300
          step: 5
          unit_of_measurement: s
    mode:
      name: Display mode
      default: photo
      selector:
        select:
          options:
            - label: Photo window
              value: photo
            - label: Switch to live stream
              value: live
            - label: Notification only
              value: notify
    https:
      name: Receiver uses HTTPS
      description: Turn on if "Use HTTPS for the API" is enabled in DoorCam.
      default: false
      selector:
        boolean:
    token:
      name: Access token (optional)
      default: ""
      selector:
        text:
mode: single
max_exceeded: silent
variables:
  player: !input receiver_player
triggers:
  - trigger: state
    entity_id: !input trigger_entity
    from: "off"
    to: "on"
conditions:
  - condition: template
    value_template: "{{ player == '' or is_state(player, 'on') }}"
actions:
  - action: rest_command.doorcam_show
    data:
      host: !input receiver_host
      cam: !input camera
      sec: !input seconds
      mode: !input mode
      token: !input token
      https: !input https
    continue_on_error: true
