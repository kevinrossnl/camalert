# CamAlert - Home Assistant package.
# Copy this file to <config>/packages/camalert.yaml and make sure configuration.yaml contains:
#   homeassistant:
#     packages: !include_dir_named packages
# Then reload "REST commands" (Developer tools > YAML) or restart Home Assistant.
# Actions are sent with POST; the access token (if you set one) goes in the X-CamAlert-Token header.
rest_command:
  camalert_show:
    # host: IP address of the receiver or Kodi box; cam: go2rtc stream name; sec: seconds; mode: photo | live | notify
    # https: true if "Use HTTPS for the API" is on in CamAlert (self-signed certificate, so verify_ssl is off).
    url: "{{ 'https' if https | default(false) else 'http' }}://{{ host }}:{{ port | default(8099) }}/camalert/show"
    method: post
    content_type: "application/json"
    payload: >-
      {"cam": {{ cam | tojson }}, "sec": {{ sec | default(30) | int }}{% if mode %}, "mode": {{ mode | tojson }}{% endif %}}
    headers:
      X-CamAlert-Token: "{{ token | default('') }}"
    timeout: 10
    verify_ssl: false
  camalert_hide:
    url: "{{ 'https' if https | default(false) else 'http' }}://{{ host }}:{{ port | default(8099) }}/camalert/hide"
    method: post
    headers:
      X-CamAlert-Token: "{{ token | default('') }}"
    timeout: 10
    verify_ssl: false
