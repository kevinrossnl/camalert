# DoorCam - Home Assistant package.
# Copy this file to <config>/packages/doorcam.yaml and make sure configuration.yaml contains:
#   homeassistant:
#     packages: !include_dir_named packages
# Then reload "REST commands" (Developer tools > YAML) or restart Home Assistant.
rest_command:
  doorcam_show:
    # host: IP address of the receiver; cam: go2rtc stream name; sec: seconds; mode: photo | live | notify
    # https: true if "Use HTTPS for the API" is on in DoorCam (self-signed certificate, so verify_ssl is off).
    url: >-
      {{ 'https' if https | default(false) else 'http' }}://{{ host }}:{{ port | default(8099) }}/doorcam/show?cam={{ cam | urlencode }}&sec={{ sec | default(30) }}{% if mode %}&mode={{ mode }}{% endif %}{% if token %}&token={{ token | urlencode }}{% endif %}
    method: get
    timeout: 10
    verify_ssl: false
  doorcam_hide:
    url: "{{ 'https' if https | default(false) else 'http' }}://{{ host }}:{{ port | default(8099) }}/doorcam/hide{% if token %}?token={{ token | urlencode }}{% endif %}"
    method: get
    timeout: 10
    verify_ssl: false
