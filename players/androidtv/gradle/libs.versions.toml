# Every dependency pinned (#64). Why each one is there: players/androidtv/DEVELOPMENT.md.
[versions]
agp = "9.5.2"
kotlin = "2.4.21"
media3 = "1.11.1"
leanback = "1.2.0"
preference = "1.2.1"
junit = "4.13.2"

[libraries]
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-rtsp = { module = "androidx.media3:media3-exoplayer-rtsp", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
leanback-preference = { module = "androidx.leanback:leanback-preference", version.ref = "leanback" }
preference = { module = "androidx.preference:preference", version.ref = "preference" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
