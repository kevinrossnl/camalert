<!DOCTYPE html>
<!-- CamAlert extension (#127): options. The token stays in chrome.storage.local (never synced). -->
<html><head><meta charset="utf-8"><title>CamAlert</title>
<style>
  body { font-family: sans-serif; max-width: 34em; margin: 1.5em auto; padding: 0 1em; color: #222; }
  label { display: block; margin: .8em 0 .2em; }
  input, select { width: 100%; box-sizing: border-box; padding: .4em; font-size: 1em; }
  input[type=checkbox] { width: auto; }
  .small { font-size: .85em; color: #555; }
  button { margin-top: 1.2em; padding: .5em 1.2em; font-size: 1em; }
  #state { margin-top: 1em; font-weight: bold; }
</style></head>
<body>
<h1>CamAlert</h1>
<form id="f" autocomplete="off">
  <label for="url" data-t="Home Assistant address"></label><input id="url" placeholder="http://192.168.1.20:8123" required>
  <label for="token" data-t="Access token"></label><input id="token" type="password" autocomplete="off">
  <p class="small" data-t="Create a long-lived access token in your Home Assistant profile, preferably for a separate user that is not an administrator."></p>
  <label for="name" data-t="Name"></label><input id="name" maxlength="64">
  <label for="server" data-t="go2rtc address"></label><input id="server" placeholder="http://192.168.1.10:1984">
  <label for="camera" data-t="Default camera"></label><input id="camera">
  <label for="duration" data-t="Duration (seconds)"></label><input id="duration" type="number" min="5" max="300" step="5">
  <label for="position" data-t="Window position"></label><select id="position"></select>
  <label for="size" data-t="Window size"></label><select id="size"></select>
  <label for="text_size" data-t="Text size"></label><select id="text_size"></select>
  <label for="chime" data-t="Doorbell chime"></label><select id="chime"></select>
  <label for="language" data-t="Language"></label><select id="language"></select>
  <label><input id="dnd" type="checkbox"> <span data-t="Do not disturb"></span></label>
  <button type="submit" data-t="Save"></button>
</form>
<div id="state"></div>
<p class="small" data-t="Add this player in Home Assistant under Settings › Devices & services: it is listed as discovered."></p>
<script type="module" src="options.js"></script>
</body></html>
