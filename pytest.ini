[pytest]
# Runner for all tests (#27). unittest classes keep working; `python3 -m unittest discover -s tests` still works too.
# Python 3.8 (Kodi 19): pip install "pytest<8.4".
testpaths = tests
python_files = test_*.py
# "build" is in the default norecursedirs, but tests/build holds the golden listings
norecursedirs = .* __pycache__ fixtures golden dist
addopts = -q -p no:cacheprovider
markers =
    lint: static checks (Python 3.8 grammar, import lint)
    core: shared core (pure Python, Python 3.8+)
    contract: the same API / MQTT contract on every platform
    enigma2: Enigma2 plugin (e2fake harness)
    kodi: Kodi add-on (Kodi stubs)
    ha: Home Assistant integration and blueprints
    build: packages, golden listings, translations, privacy
    slow: takes more than a second
    device: needs a real receiver, Kodi or Home Assistant (never in CI)
filterwarnings =
    ignore::ResourceWarning
